<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Connexion</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2>TaskFlow</h2>
            <p>Heureux de vous revoir ! Connectez-vous.</p>
        </div>

        <div id="message" class="alert"></div>

        <form onsubmit="return false;">
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" placeholder="exemple@domaine.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="button" id="loginBtn" class="btn-submit">Se connecter</button>
        </form>

        <div class="auth-footer">
            Nouveau sur TaskFlow ? <a href="register.html">Créer un compte</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
