<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Tableau de bord</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="navbar-inner">
            
            <div class="navbar-brand-box">
                <h3 class="brand-title">TaskFlow</h3>
            </div>
            
            <div class="navbar-actions-box">
                
                <div class="notification-bell-box">
                    <button class="bell-toggle-btn" id="bellBtn">🔔</button>
                    <span class="numeric-badge" id="notifBadge">0</span>
                    
                    <div class="notif-dropdown" id="notifDropdown">
                        <div class="notif-header">
                            <h4>Nouvelles Alertes</h4>
                        </div>
                        
                        <div class="notif-scroll-area" id="unreadList">
                            </div>
                        
                        <div class="archive-title-block">
                            📦 Archives (LocalStorage)
                        </div>
                        
                        <div class="archive-scroll-area" id="archiveList">
                            </div>
                    </div>
                </div>

                <button class="btn-logout" id="logoutBtn">Déconnexion</button>
                
            </div>
        </div>
    </header>

    <main class="dashboard-content">
        <h1 id="welcomeMessage">Bienvenue sur votre espace TaskFlow</h1>
        <p>Sélectionnez un projet pour commencer à collaborer avec votre équipe.</p>
    </main>

    <script>
        // Vérification instantanée : si aucun token n'existe, on bloque l'accès
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
        
        // Affichage personnalisé du nom de l'étudiant connecté
        const userSession = JSON.parse(localStorage.getItem('user'));
        if (userSession && userSession.name) {
            document.getElementById('welcomeMessage').innerText = `Bienvenue, ${userSession.name} !`;
        }
    </script>

    <script src="js/notifications.js"></script>

</body>
</html>
